services:
  writing-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: writing-assistant:latest
    container_name: writing-assistant
    ports:
      # 左边是宿主机端口，可自行改成别的（如 "8080:9000"）。
      - "9000:9000"
    env_file:
      # 直接透传根目录 .env（模型 Key、KnG、GLM、并发数等全部生效）
      - .env
    environment:
      # 只覆盖两个持久化路径：.env 里是宿主机相对路径，
      # 容器内改成绝对路径并落到挂载的数据卷，跨重启保留。
      DATABASE_URL: sqlite:////app/data/writing_assistant.db
      AGENT_CHECKPOINT_PATH: /app/data/agent_checkpoints.sqlite
    volumes:
      # SQLite 数据库 + LangGraph 检查点
      - app-data:/app/data
      # 上传的参考文档
      - app-session-files:/app/session_files
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/api/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app-data:
  app-session-files:
